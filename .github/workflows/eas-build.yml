name: EAS build check

# Runs an actual native build (Gradle for Android / Xcode for iOS) via EAS,
# rather than just the JS bundle check in ci.yml. Exercises the real
# compile-and-link path, so it catches native-module version mismatches
# (e.g. a reanimated/react-native version drift) that a Metro bundle export
# can't. Manual-only: an EAS build consumes build credits/minutes and takes
# several minutes to tens of minutes per platform, so it isn't run on every
# push - trigger it before a release, or after touching native
# dependencies/app.json/eas.json.
#
# Requires a repo secret EXPO_TOKEN: an Expo access token with permission to
# build this project (Expo dashboard -> Account settings -> Access tokens).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        description: eas.json build profile
        type: choice
        options: [preview, production, development]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive
